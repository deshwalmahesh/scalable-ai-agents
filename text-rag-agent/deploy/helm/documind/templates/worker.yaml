{{- $secret := .Values.existingSecret | default (printf "%s-secret" .Release.Name) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels: {app: {{ .Release.Name }}-worker}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {app: {{ .Release.Name }}-worker}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-worker}
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uv", "run", "--no-dev", "arq", "app.worker.WorkerSettings"]
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-config}
            - secretRef: {name: {{ $secret }}}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
