name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports: ["6333:6333"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      QDRANT_URL: http://localhost:6333
      REDIS_URL: redis://localhost:6379/0
      # Integration tests run for real when this secret is set; otherwise they auto-skip.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check app tests
      - name: Format check
        run: uv run ruff format --check app tests
      - name: Type check
        run: uv run mypy app
      - name: Unit + smoke tests
        run: uv run pytest tests/unit tests/smoke -q
      - name: Integration tests (real Qdrant + Gemini; skips without GEMINI_API_KEY)
        run: uv run pytest tests/integration -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build combined image (SPA + API)
        run: docker build -t documind .
