# Shared backend/worker config — declared ONCE here, referenced by both services.
# Change a URL or model in one place and both the API and the worker pick it up.
x-app-env: &app-env
  APP_ENV: prod
  DATABASE_URL: postgresql+asyncpg://documind:documind@postgres:5432/documind
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  INGEST_EXECUTOR: queue
  CHAT_MODEL: ${CHAT_MODEL:-gemini-3.1-flash-lite}
  EMBED_MODEL: ${EMBED_MODEL:-gemini-embedding-2}
  # Missing key → app warns; JWT default → app refuses to boot in prod (guard lives in the
  # app's startup, so lifecycle commands like `down`/`ps` don't require these to be set).
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_IN_PROD}

x-depends: &app-depends
  postgres: {condition: service_healthy}
  redis: {condition: service_healthy}
  qdrant: {condition: service_healthy}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
      POSTGRES_DB: documind
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    environment:
      <<: *app-env
      CORS_ORIGINS: http://localhost,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on: *app-depends
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build: .
    command: ["uv", "run", "--no-dev", "arq", "app.worker.WorkerSettings"]
    environment:
      <<: *app-env
    depends_on: *app-depends
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  qdrant_data:
